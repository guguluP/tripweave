<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <style>
    @font-face {
      font-family: "Fraunces";
      src: url("og-fonts/fraunces-600.ttf") format("truetype");
      font-weight: 600;
      font-style: normal;
    }
    @font-face {
      font-family: "Fraunces";
      src: url("og-fonts/fraunces-500.ttf") format("truetype");
      font-weight: 500;
      font-style: normal;
    }
    @font-face {
      font-family: "Figtree";
      src: url("og-fonts/figtree-500.ttf") format("truetype");
      font-weight: 500;
      font-style: normal;
    }
    @font-face {
      font-family: "Figtree";
      src: url("og-fonts/figtree-600.ttf") format("truetype");
      font-weight: 600;
      font-style: normal;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 1200px;
      height: 630px;
      overflow: hidden;
      background: #f3efe6;
    }
    .card {
      position: relative;
      width: 1200px;
      height: 630px;
    }
    .lockup {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -52%);
      width: 640px;
      text-align: center;
      z-index: 4;
    }
    .plate {
      background: rgba(255, 253, 248, 0.92);
      border: 1px solid rgba(30, 88, 83, 0.22);
      box-shadow:
        0 0 0 6px rgba(255, 253, 248, 0.55),
        0 18px 40px -18px rgba(26, 23, 20, 0.28);
      padding: 36px 48px 32px;
    }
    .kicker {
      font-family: "Figtree", sans-serif;
      font-weight: 600;
      font-size: 13px;
      letter-spacing: 0.38em;
      text-transform: uppercase;
      color: #6a635a;
      margin-bottom: 14px;
    }
    .wordmark {
      font-family: "Fraunces", serif;
      font-weight: 600;
      font-size: 92px;
      line-height: 0.92;
      letter-spacing: -0.03em;
      color: #1e5853;
    }
    .tag {
      font-family: "Figtree", sans-serif;
      font-weight: 500;
      font-size: 20px;
      letter-spacing: 0.04em;
      color: #6a635a;
      margin-top: 16px;
    }
    .rule {
      width: 72px;
      height: 2px;
      background: #1e5853;
      margin: 18px auto 0;
      opacity: 0.85;
    }
    .mark {
      width: 36px;
      height: 36px;
      margin: 0 auto 12px;
    }
  </style>
</head>
<body>
  <div class="card">
    <svg viewBox="0 0 1200 630" width="1200" height="630" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <defs>
        <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#d9cfc0"/>
          <stop offset="42%" stop-color="#efe8dc"/>
          <stop offset="100%" stop-color="#fffdf8"/>
        </linearGradient>
        <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#3a7a74"/>
          <stop offset="45%" stop-color="#1e5853"/>
          <stop offset="100%" stop-color="#163f3b"/>
        </linearGradient>
        <linearGradient id="sand" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#e7d8c2"/>
          <stop offset="100%" stop-color="#cbbba3"/>
        </linearGradient>
        <linearGradient id="stone" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0%" stop-color="#b7aa98"/>
          <stop offset="18%" stop-color="#e4d9c8"/>
          <stop offset="55%" stop-color="#f3efe6"/>
          <stop offset="100%" stop-color="#cfc3b1"/>
        </linearGradient>
        <linearGradient id="lintel" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#efe6d8"/>
          <stop offset="100%" stop-color="#d8ccba"/>
        </linearGradient>
        <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#c4b49a"/>
          <stop offset="100%" stop-color="#9e8e76"/>
        </linearGradient>
        <filter id="grain">
          <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" stitchTiles="stitch"/>
          <feColorMatrix type="saturate" values="0"/>
          <feComponentTransfer>
            <feFuncA type="table" tableValues="0 0.10"/>
          </feComponentTransfer>
        </filter>
      </defs>

      <!-- VIEW: Puri beach through the gallery -->
      <rect width="1200" height="630" fill="url(#sky)"/>
      <!-- haze band -->
      <rect x="0" y="210" width="1200" height="80" fill="#fffdf8" opacity="0.45"/>

      <!-- distant temple (Jagannath rekha deul) -->
      <g transform="translate(800,148)" fill="#6a635a" opacity="0.52">
        <path d="M70 0
                 C73 6 76 10 77 16
                 C90 36 108 62 108 102
                 L108 132 L32 132 L32 102
                 C32 62 50 36 63 16
                 C64 10 67 6 70 0 Z"/>
        <ellipse cx="70" cy="22" rx="14" ry="7"/>
        <rect x="67" y="-10" width="6" height="14" rx="1.5"/>
        <rect x="24" y="128" width="92" height="12"/>
        <rect x="16" y="138" width="108" height="8"/>
        <!-- shallow ridges -->
        <path d="M70 28 C78 48 88 72 88 110" fill="none" stroke="#1a1714" stroke-opacity="0.18" stroke-width="1.2"/>
        <path d="M70 28 C62 48 52 72 52 110" fill="none" stroke="#1a1714" stroke-opacity="0.18" stroke-width="1.2"/>
      </g>
      <!-- smaller shrine -->
      <g transform="translate(748,206)" fill="#6a635a" opacity="0.34">
        <path d="M34 0 C36 4 38 8 39 14 C48 28 58 46 58 70 L58 92 L10 92 L10 70 C10 46 20 28 29 14 C30 8 32 4 34 0 Z"/>
        <rect x="4" y="90" width="60" height="8"/>
      </g>

      <!-- sea -->
      <rect x="0" y="268" width="1200" height="176" fill="url(#sea)"/>
      <!-- wave lines -->
      <path d="M0 292 Q150 284 300 292 T600 292 T900 292 T1200 292" fill="none" stroke="#fffdf8" stroke-opacity="0.18" stroke-width="1.4"/>
      <path d="M0 318 Q180 308 360 318 T720 318 T1080 318 T1200 322" fill="none" stroke="#cfe0dc" stroke-opacity="0.22" stroke-width="1.2"/>
      <path d="M0 352 Q140 344 280 352 T560 352 T840 352 T1200 348" fill="none" stroke="#fffdf8" stroke-opacity="0.12" stroke-width="1.5"/>
      <path d="M0 388 Q200 378 400 388 T800 388 T1200 384" fill="none" stroke="#9bb8b3" stroke-opacity="0.28" stroke-width="1.2"/>
      <!-- tiny boats -->
      <g fill="#1a1714" opacity="0.35">
        <path d="M248 306 l18 0 l-4 4 h-10 z"/>
        <rect x="256" y="296" width="1.4" height="10"/>
        <path d="M520 298 l22 0 l-5 5 h-12 z"/>
        <rect x="530" y="286" width="1.4" height="12"/>
      </g>

      <!-- beach -->
      <path d="M0 430 C180 418 340 424 520 436 C760 452 980 442 1200 428 L1200 520 L0 520 Z" fill="url(#sand)"/>
      <!-- wet sand edge -->
      <path d="M0 430 C180 418 340 424 520 436 C760 452 980 442 1200 428 L1200 438 C980 452 760 462 520 446 C340 434 180 428 0 440 Z" fill="#1e5853" opacity="0.18"/>

      <!-- palms on the left beach -->
      <g transform="translate(168,368)" fill="#1e5853" opacity="0.72">
        <rect x="28" y="42" width="5" height="78" rx="2"/>
        <path d="M30 46 C8 28 -6 36 4 22 C22 18 34 34 30 46Z"/>
        <path d="M32 44 C22 16 36 2 48 14 C46 32 38 44 32 44Z"/>
        <path d="M33 48 C48 28 72 32 58 18 C42 22 30 40 33 48Z"/>
        <path d="M30 50 C12 48 -4 62 10 66 C24 60 32 54 30 50Z"/>
      </g>
      <g transform="translate(214,392) scale(0.72)" fill="#1e5853" opacity="0.5">
        <rect x="28" y="42" width="5" height="70" rx="2"/>
        <path d="M30 46 C8 28 -6 36 4 22 C22 18 34 34 30 46Z"/>
        <path d="M32 44 C22 16 36 2 48 14 C46 32 38 44 32 44Z"/>
        <path d="M33 48 C48 28 72 32 58 18 C42 22 30 40 33 48Z"/>
      </g>

      <!-- rattan chair on verandah, left -->
      <g transform="translate(128,478)" fill="none" stroke="#1a1714" stroke-width="2" opacity="0.45">
        <path d="M8 8 q22 -18 44 0 v38 h-44 z"/>
        <path d="M8 46 l-10 28"/>
        <path d="M52 46 l10 28"/>
        <path d="M8 46 h44"/>
        <path d="M14 18 h32" stroke-width="1"/>
        <path d="M14 28 h32" stroke-width="1"/>
        <path d="M14 38 h32" stroke-width="1"/>
      </g>

      <!-- ARCHITECTURE: heritage gallery -->
      <rect x="0" y="0" width="1200" height="78" fill="url(#lintel)"/>
      <rect x="0" y="72" width="1200" height="10" fill="#cfc3b1"/>
      <!-- beam shadow -->
      <rect x="96" y="82" width="1008" height="18" fill="#1a1714" opacity="0.08"/>

      <!-- floor -->
      <rect x="0" y="508" width="1200" height="122" fill="url(#floor)"/>
      <g stroke="#1a1714" stroke-opacity="0.12" stroke-width="1">
        <line x1="0" y1="528" x2="1200" y2="528"/>
        <line x1="0" y1="556" x2="1200" y2="556"/>
        <line x1="0" y1="586" x2="1200" y2="586"/>
        <line x1="0" y1="616" x2="1200" y2="616"/>
      </g>
      <!-- floor boards perspective lines -->
      <g stroke="#1a1714" stroke-opacity="0.08" stroke-width="1">
        <line x1="200" y1="508" x2="80" y2="630"/>
        <line x1="400" y1="508" x2="340" y2="630"/>
        <line x1="600" y1="508" x2="600" y2="630"/>
        <line x1="800" y1="508" x2="860" y2="630"/>
        <line x1="1000" y1="508" x2="1120" y2="630"/>
      </g>

      <!-- left column -->
      <rect x="0" y="0" width="108" height="630" fill="url(#stone)"/>
      <rect x="18" y="78" width="72" height="452" fill="#efe6d8"/>
      <rect x="18" y="78" width="10" height="452" fill="#1a1714" opacity="0.08"/>
      <rect x="80" y="78" width="10" height="452" fill="#1a1714" opacity="0.12"/>
      <!-- capital -->
      <rect x="8" y="58" width="92" height="28" fill="#f3efe6"/>
      <rect x="4" y="50" width="100" height="10" fill="#d8ccba"/>
      <!-- base -->
      <rect x="6" y="520" width="96" height="22" fill="#d8ccba"/>
      <rect x="0" y="540" width="108" height="90" fill="#c4b49a"/>

      <!-- right column -->
      <rect x="1092" y="0" width="108" height="630" fill="url(#stone)"/>
      <rect x="1110" y="78" width="72" height="452" fill="#efe6d8"/>
      <rect x="1110" y="78" width="10" height="452" fill="#fffdf8" opacity="0.35"/>
      <rect x="1172" y="78" width="10" height="452" fill="#1a1714" opacity="0.1"/>
      <rect x="1100" y="58" width="92" height="28" fill="#f3efe6"/>
      <rect x="1096" y="50" width="100" height="10" fill="#d8ccba"/>
      <rect x="1098" y="520" width="96" height="22" fill="#d8ccba"/>
      <rect x="1092" y="540" width="108" height="90" fill="#c4b49a"/>

      <!-- inner column edges (depth) -->
      <rect x="108" y="78" width="14" height="430" fill="#1a1714" opacity="0.10"/>
      <rect x="1078" y="78" width="14" height="430" fill="#1a1714" opacity="0.16"/>

      <!-- grain overlay -->
      <rect width="1200" height="630" filter="url(#grain)" opacity="0.22"/>
    </svg>

    <div class="lockup">
      <div class="plate">
        <svg class="mark" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
          <rect width="32" height="32" rx="7" fill="#1e5853"/>
          <rect x="8" y="6.5" width="5.5" height="1.5" fill="#fffdf8"/>
          <rect x="8" y="13.5" width="5.5" height="12" fill="#fffdf8"/>
          <rect x="18.5" y="6.5" width="5.5" height="12" fill="#fffdf8"/>
          <rect x="18.5" y="24" width="5.5" height="1.5" fill="#fffdf8"/>
          <rect x="6.5" y="8" width="12" height="5.5" fill="#fffdf8"/>
          <rect x="24" y="8" width="1.5" height="5.5" fill="#fffdf8"/>
          <rect x="6.5" y="18.5" width="1.5" height="5.5" fill="#fffdf8"/>
          <rect x="13.5" y="18.5" width="12" height="5.5" fill="#fffdf8"/>
        </svg>
        <div class="kicker">Puri · Odisha</div>
        <div class="wordmark">TripWeave</div>
        <div class="rule"></div>
        <div class="tag">Honest stays · all-in prices</div>
      </div>
    </div>
  </div>
</body>
</html>
