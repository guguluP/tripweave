<!DOCTYPE html>
<html>
<body style="margin:0;background:#ddd;display:flex;gap:24px;padding:24px;align-items:flex-end">
  <div>
    <p style="font:12px sans-serif">A W stroke 32</p>
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
      <rect width="32" height="32" rx="7" fill="#1e5853"/>
      <path d="M7 9 L12.2 23 L16 13.5 L19.8 23 L25 9" fill="none" stroke="#fffdf8" stroke-width="3.2" stroke-linecap="square" stroke-linejoin="miter"/>
    </svg>
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="16" height="16">
      <rect width="32" height="32" rx="7" fill="#1e5853"/>
      <path d="M7 9 L12.2 23 L16 13.5 L19.8 23 L25 9" fill="none" stroke="#fffdf8" stroke-width="3.2" stroke-linecap="square" stroke-linejoin="miter"/>
    </svg>
  </div>
  <div>
    <p style="font:12px sans-serif">B filled W</p>
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
      <rect width="32" height="32" rx="7" fill="#1e5853"/>
      <path fill="#fffdf8" d="M5.8 8.2h4.4l3.5 10.2 2.3-6.8h3.9l2.3 6.8 3.5-10.2h4.4L22.4 24h-4.6L16 16.6 14.2 24H9.6L5.8 8.2z"/>
    </svg>
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="16" height="16">
      <rect width="32" height="32" rx="7" fill="#1e5853"/>
      <path fill="#fffdf8" d="M5.8 8.2h4.4l3.5 10.2 2.3-6.8h3.9l2.3 6.8 3.5-10.2h4.4L22.4 24h-4.6L16 16.6 14.2 24H9.6L5.8 8.2z"/>
    </svg>
  </div>
  <div>
    <p style="font:12px sans-serif">C weave 2x2</p>
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
      <rect width="32" height="32" rx="7" fill="#1e5853"/>
      <!-- v1 under h1, over h2 -->
      <rect x="8" y="6.5" width="5.5" height="2" fill="#fffdf8"/>
      <rect x="8" y="13.5" width="5.5" height="5" fill="#fffdf8"/>
      <rect x="8" y="18.5" width="5.5" height="7" fill="#fffdf8"/>
      <!-- v2 over h1, under h2 -->
      <rect x="18.5" y="6.5" width="5.5" height="12" fill="#fffdf8"/>
      <rect x="18.5" y="24" width="5.5" height="1.5" fill="#fffdf8"/>
      <!-- h1 over v1, under v2 -->
      <rect x="6.5" y="8" width="12" height="5.5" fill="#fffdf8"/>
      <!-- h2 under v1, over v2 -->
      <rect x="13.5" y="18.5" width="12" height="5.5" fill="#fffdf8"/>
      <rect x="6.5" y="18.5" width="1.5" height="5.5" fill="#fffdf8"/>
    </svg>
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="16" height="16">
      <rect width="32" height="32" rx="7" fill="#1e5853"/>
      <rect x="8" y="6.5" width="5.5" height="2" fill="#fffdf8"/>
      <rect x="8" y="13.5" width="5.5" height="5" fill="#fffdf8"/>
      <rect x="8" y="18.5" width="5.5" height="7" fill="#fffdf8"/>
      <rect x="18.5" y="6.5" width="5.5" height="12" fill="#fffdf8"/>
      <rect x="18.5" y="24" width="5.5" height="1.5" fill="#fffdf8"/>
      <rect x="6.5" y="8" width="12" height="5.5" fill="#fffdf8"/>
      <rect x="13.5" y="18.5" width="12" height="5.5" fill="#fffdf8"/>
      <rect x="6.5" y="18.5" width="1.5" height="5.5" fill="#fffdf8"/>
    </svg>
  </div>
  <div>
    <p style="font:12px sans-serif">D interlaced W ribbons</p>
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
      <rect width="32" height="32" rx="7" fill="#1e5853"/>
      <path d="M8 8 L13 22" stroke="#fffdf8" stroke-width="3.4" stroke-linecap="butt"/>
      <path d="M19 22 L24 8" stroke="#fffdf8" stroke-width="3.4" stroke-linecap="butt"/>
      <path d="M13 22 L16 14 L19 22" stroke="#fffdf8" stroke-width="3.4" stroke-linecap="butt" stroke-linejoin="miter"/>
    </svg>
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="16" height="16">
      <rect width="32" height="32" rx="7" fill="#1e5853"/>
      <path d="M8 8 L13 22" stroke="#fffdf8" stroke-width="3.4" stroke-linecap="butt"/>
      <path d="M19 22 L24 8" stroke="#fffdf8" stroke-width="3.4" stroke-linecap="butt"/>
      <path d="M13 22 L16 14 L19 22" stroke="#fffdf8" stroke-width="3.4" stroke-linecap="butt" stroke-linejoin="miter"/>
    </svg>
  </div>
</body>
</html>
